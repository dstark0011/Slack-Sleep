name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q slack-repo.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: repo/android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: mv repo/android/app/build/outputs/apk/debug/app-debug.apk slack.apk

      - uses: actions/upload-artifact@v4
        with:
          name: slack-apk
          path: slack.apk

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Slack build ${{ github.run_number }}
          files: slack.apk
          make_latest: true
