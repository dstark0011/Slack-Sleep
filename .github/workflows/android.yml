name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "web/**", ".github/workflows/android.yml"]
  pull_request:
    branches: [main]
    paths: ["android/**", "web/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the release the app updates from

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        env:
          # The build number becomes the app's versionCode, so each release is newer
          # than the last and the in-app updater can detect it.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk slack.apk

      - uses: actions/upload-artifact@v4
        with:
          name: slack-apk
          path: slack.apk
          retention-days: 30

      # Publish as the "latest" release so the phone can fetch it and
      # https://github.com/dstark0011/Slack-Sleep/releases/latest/download/slack.apk keeps working.
      - name: Publish as latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Slack build ${{ github.run_number }}
          files: slack.apk
          make_latest: true
